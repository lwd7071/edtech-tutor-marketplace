services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tunnel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.cloud
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      APP_FRONTEND_URL: https://tutormatch.id.vn
      APP_CORS_ALLOWED_ORIGINS: https://tutormatch.id.vn
      APP_OAUTH2_FRONTEND_CALLBACK_URI: https://tutormatch.id.vn/oauth2/callback
      GOOGLE_OAUTH_REDIRECT_URI: https://tutormatch.id.vn/login/oauth2/code/google
      APP_CACHE_REVALIDATION_ENABLED: "false"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env.tunnel}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tunnel_redis_data:
