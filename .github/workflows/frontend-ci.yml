name: Frontend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  verify:
    name: Frontend checks and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: |
          node e2e/subjects-api-fixture.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          fixture_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3181/api/public/subjects >/dev/null; then
              fixture_ready=1
              break
            fi
            sleep 1
          done
          if [ "$fixture_ready" -ne 1 ]; then
            echo 'Public API fixture did not start.'
            exit 1
          fi
          BACKEND_API_URL=http://127.0.0.1:3181 npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
