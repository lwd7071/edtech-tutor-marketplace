name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Build and Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Docker Environment
        run: |
          docker --version
          docker compose version
          docker info
          docker compose -f docker-compose.yml config --quiet

      - name: Validate Compose healthchecks
        run: |
          docker compose -f docker-compose.yml config | grep -A8 'healthcheck:'

      - name: Run Maven Tests with Testcontainers
        working-directory: backend
        run: mvn clean verify -B --no-transfer-progress -Dfile.encoding=UTF-8

      - name: Smoke-test local Compose startup
        run: |
          docker compose up -d --build backend
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' edtech_backend)
            if [ "$status" = "healthy" ]; then
              curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null
              exit 0
            fi
            if [ "$status" = "exited" ]; then
              docker compose logs backend
              exit 1
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Stop Compose services
        if: always()
        run: docker compose down -v

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker Image Build Validation
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: edtech-api:latest


