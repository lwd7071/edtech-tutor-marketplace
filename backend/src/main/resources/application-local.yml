spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edtech_db}
    username: ${DB_USERNAME:edtech_user}
    password: ${DB_PASSWORD:edtech_password}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-secret-change-before-sharing-32chars}
