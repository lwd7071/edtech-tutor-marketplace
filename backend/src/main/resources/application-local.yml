spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/edtech_db}
    username: ${DB_USERNAME:edtech_user}
    password: ${DB_PASSWORD:edtech_password}

  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-secret-disabled}
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: email,profile

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

app:
  email:
    provider: logging
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-secret-change-before-sharing-32chars}
  cloudinary:
    url: ${CLOUDINARY_URL:cloudinary://local:local@local}
  finance:
    account-encryption:
      key: ${EDTECH_ACCOUNT_ENCRYPTION_KEY:local-dev-account-key-32-chars!!}

management:
  health:
    mail:
      enabled: false
