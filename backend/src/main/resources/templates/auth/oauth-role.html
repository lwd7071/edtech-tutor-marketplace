<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7"><title th:text="${oauthRoleReady} ? 'Chọn vai trò | Tutor Match' : 'Phiên đăng ký đã kết thúc | Tutor Match'">Chọn vai trò | Tutor Match</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<a class="auth-skip" href="#main-content">Bỏ qua đến lựa chọn</a>
<main id="main-content" class="auth-page">
  <a class="auth-brand" href="/" aria-label="Tutor Match — Trang chủ">tutor<span>match</span></a>
  <section class="auth-card" aria-labelledby="oauth-role-title">
    <h1 id="oauth-role-title" th:text="${oauthRoleReady} ? 'Bạn tham gia với vai trò nào?' : 'Phiên đăng ký đã kết thúc'">Bạn tham gia với vai trò nào?</h1>
    <p class="auth-intro" th:if="${oauthRoleReady}">Chọn cách bạn muốn sử dụng Tutor Match.</p>
    <div th:if="${oauthRoleError}" class="auth-notice auth-notice--error" role="alert" tabindex="-1" autofocus th:text="${oauthRoleError}"></div>
    <form th:if="${oauthRoleReady}" class="auth-form" method="post" action="/auth/oauth/role" th:object="${oauthRoleForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <fieldset class="auth-role" th:attr="aria-describedby=${#fields.hasErrors('role')} ? 'oauth-role-error' : null">
        <legend>Chọn một vai trò</legend>
        <label class="auth-role-option"><input type="radio" value="STUDENT" th:field="*{role}" required th:attr="autofocus=${#fields.hasErrors('role') ? 'autofocus' : null}"> Học viên — tìm gia sư và theo dõi buổi học</label>
        <label class="auth-role-option"><input type="radio" value="TEACHER" th:field="*{role}" required> Gia sư — tạo hồ sơ và quản lý lớp học</label>
        <p id="oauth-role-error" class="auth-field-error" role="alert" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
      </fieldset>
      <button class="auth-submit" type="submit">Tiếp tục <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-register"><a href="/auth/login">Quay lại đăng nhập</a></p>
  </section>
</main>
</body>
</html>
