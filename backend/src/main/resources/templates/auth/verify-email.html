<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7"><title>Xác minh email | Tutor Match</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<a class="auth-skip" href="#main-content">Bỏ qua đến nội dung</a>
<main id="main-content" class="auth-page">
  <a class="auth-brand" href="/" aria-label="Tutor Match — Trang chủ">tutor<span>match</span></a>
  <section class="auth-card" aria-labelledby="verify-title">
    <h1 id="verify-title">Xác minh email</h1>
    <p class="auth-intro" th:if="${registered}">Tài khoản đã được tạo. Mở email xác minh rồi quay lại đây để kích hoạt tài khoản.</p>
    <p class="auth-intro" th:unless="${registered}">Xác minh địa chỉ email để hoàn tất kích hoạt tài khoản.</p>
    <div th:if="${verificationComplete}" class="auth-notice auth-notice--success" role="status">Email đã được xác minh. Bạn có thể đăng nhập.</div>
    <div th:if="${resendNotice}" class="auth-notice auth-notice--success" role="status" th:text="${resendNotice}"></div>
    <div th:if="${verificationError}" class="auth-notice auth-notice--error" role="alert" tabindex="-1" autofocus th:text="${verificationError}"></div>
    <div th:if="${resendError}" class="auth-notice auth-notice--error" role="alert" th:text="${resendError}"></div>

    <form th:if="${verificationReady}" class="auth-form auth-form--spaced" method="post" action="/auth/verify-email">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button class="auth-submit" type="submit">Xác minh email <span aria-hidden="true">→</span></button>
    </form>

    <div class="auth-divider"><span>Không thấy email?</span></div>
    <form class="auth-form" method="post" action="/auth/verify-email/resend" th:object="${emailForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="auth-field"><label for="verify-email">Email tài khoản</label><input id="verify-email" type="email" autocomplete="email" inputmode="email" maxlength="254" required th:field="*{email}"
        th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'verify-email-error' : null,autofocus=${#fields.hasErrors('email') or resendError != null ? 'autofocus' : null}"></div>
      <p id="verify-email-error" class="auth-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
      <button class="auth-submit auth-submit--secondary" type="submit">Gửi lại hướng dẫn</button>
    </form>
    <p class="auth-register"><a href="/auth/login">Quay lại đăng nhập</a></p>
  </section>
</main>
</body>
</html>
