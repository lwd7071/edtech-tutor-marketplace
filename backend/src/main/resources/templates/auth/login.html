<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7">
  <title>Đăng nhập | Tutor Match</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<a class="auth-skip" href="#main-content">Bỏ qua đến biểu mẫu</a>
<main id="main-content" class="auth-page">
  <a class="auth-brand" href="/" aria-label="Tutor Match — Trang chủ">tutor<span>match</span></a>
  <section class="auth-card" aria-labelledby="login-title">
    <h1 id="login-title">Đăng nhập</h1>
    <p class="auth-intro">Tiếp tục hành trình học cùng gia sư của bạn.</p>

    <div th:if="${logoutNotice}" class="auth-notice auth-notice--success" role="status" th:text="${logoutNotice}"></div>
    <div th:if="${passwordResetComplete}" class="auth-notice auth-notice--success" role="status">Mật khẩu đã được cập nhật. Hãy đăng nhập lại.</div>
    <div id="login-error" th:if="${loginError}" class="auth-notice auth-notice--error" role="alert" th:text="${loginError}"></div>

    <form class="auth-form" method="post" action="/auth/login" th:object="${loginForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input type="hidden" name="continueTo" th:value="${continueTo}">

      <div class="auth-field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" inputmode="email"
               required maxlength="254" th:field="*{email}"
               th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : (${loginError} ? 'login-error' : null),autofocus=${loginError} ? 'autofocus' : null">
        <p id="email-error" class="auth-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
      </div>

      <div class="auth-field">
        <div class="auth-label-row"><label for="password">Mật khẩu</label><a href="/auth/forgot-password">Quên mật khẩu?</a></div>
        <input id="password" type="password" name="password" autocomplete="current-password"
               required maxlength="128" th:field="*{password}"
               th:attr="aria-invalid=${#fields.hasErrors('password')},aria-describedby=${#fields.hasErrors('password')} ? 'password-error' : null">
        <p id="password-error" class="auth-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
      </div>

      <button class="auth-submit" type="submit">Đăng nhập <span aria-hidden="true">→</span></button>
    </form>
    <div class="auth-divider"><span>hoặc</span></div>
    <a class="auth-submit auth-submit--secondary auth-oauth" href="/auth/oauth/google">Tiếp tục với Google</a>
    <p class="auth-register">Chưa có tài khoản? <a href="/auth/register">Tạo tài khoản</a></p>
  </section>
  <p class="auth-back"><a href="/teachers">← Tìm gia sư</a></p>
</main>
</body>
</html>
