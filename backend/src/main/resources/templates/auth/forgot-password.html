<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7"><title>Khôi phục mật khẩu | Tutor Match</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<a class="auth-skip" href="#main-content">Bỏ qua đến biểu mẫu</a>
<main id="main-content" class="auth-page">
  <a class="auth-brand" href="/" aria-label="Tutor Match — Trang chủ">tutor<span>match</span></a>
  <section class="auth-card" aria-labelledby="forgot-title">
    <h1 id="forgot-title">Quên mật khẩu?</h1>
    <p class="auth-intro">Nhập email tài khoản. Nếu tài khoản có thể đặt lại mật khẩu, hướng dẫn sẽ được gửi qua email.</p>
    <div th:if="${requestSent}" class="auth-notice auth-notice--success" role="status">Nếu email này có tài khoản, hướng dẫn đặt lại đã được gửi.</div>
    <div th:if="${requestError}" class="auth-notice auth-notice--error" role="alert" th:text="${requestError}"></div>
    <form class="auth-form" method="post" action="/auth/forgot-password" th:object="${emailForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="auth-field"><label for="forgot-email">Email</label><input id="forgot-email" type="email" autocomplete="email" inputmode="email" maxlength="254" required th:field="*{email}"
        th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email')} ? 'forgot-email-error' : null,autofocus=${#fields.hasErrors('email') or requestError != null ? 'autofocus' : null}">
        <p id="forgot-email-error" class="auth-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p></div>
      <button class="auth-submit" type="submit">Gửi hướng dẫn <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-register"><a href="/auth/login">Quay lại đăng nhập</a></p>
  </section>
</main>
</body>
</html>
