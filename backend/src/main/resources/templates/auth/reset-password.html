<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7"><title>Đặt lại mật khẩu | Tutor Match</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<a class="auth-skip" href="#main-content">Bỏ qua đến biểu mẫu</a>
<main id="main-content" class="auth-page">
  <a class="auth-brand" href="/" aria-label="Tutor Match — Trang chủ">tutor<span>match</span></a>
  <section class="auth-card" aria-labelledby="reset-title">
    <h1 id="reset-title">Đặt lại mật khẩu</h1>
    <p class="auth-intro">Tạo mật khẩu mới cho tài khoản của bạn.</p>
    <div th:if="${resetError}" class="auth-notice auth-notice--error" role="alert" tabindex="-1" autofocus th:text="${resetError}"></div>
    <form th:if="${resetTokenReady}" class="auth-form" method="post" action="/auth/reset-password" th:object="${resetForm}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="auth-field"><label for="new-password">Mật khẩu mới</label><input id="new-password" type="password" autocomplete="new-password" maxlength="128" required th:field="*{newPassword}"
        th:attr="aria-invalid=${#fields.hasErrors('newPassword')},aria-describedby=${#fields.hasErrors('newPassword')} ? 'new-password-help new-password-error' : 'new-password-help',autofocus=${#fields.hasErrors('newPassword') ? 'autofocus' : null}">
        <p id="new-password-help" class="auth-field-hint">Ít nhất 8 ký tự, gồm chữ cái, chữ số và ký tự đặc biệt.</p>
        <p id="new-password-error" class="auth-field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p></div>
      <button class="auth-submit" type="submit">Cập nhật mật khẩu <span aria-hidden="true">→</span></button>
    </form>
    <p th:unless="${resetTokenReady}" class="auth-register"><a href="/auth/forgot-password">Yêu cầu liên kết mới</a></p>
    <p class="auth-register"><a href="/auth/login">Quay lại đăng nhập</a></p>
  </section>
</main>
</body>
</html>
