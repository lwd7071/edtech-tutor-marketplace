spring:
  config:
    activate:
      on-profile: cloud
    import:
      - optional:file:.env.cloud[.properties]
      - optional:file:../.env.cloud[.properties]

  datasource:
    url: ${CLOUD_DB_URL:${DB_URL}}
    username: ${CLOUD_DB_USERNAME:${DB_USERNAME}}
    password: ${CLOUD_DB_PASSWORD:${DB_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
