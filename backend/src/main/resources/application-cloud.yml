spring:
  config:
    activate:
      on-profile: cloud
    import:
      - optional:file:.env.cloud[.properties]
      - optional:file:../.env.cloud[.properties]

  datasource:
    url: ${CLOUD_DB_URL:${DB_URL}}
    username: ${CLOUD_DB_USERNAME:${DB_USERNAME}}
    password: ${CLOUD_DB_PASSWORD:${DB_PASSWORD}}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: email,profile

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  email:
    provider: ${APP_EMAIL_PROVIDER:brevo}
    from: ${BREVO_SENDER_EMAIL}
    sender-name: ${BREVO_SENDER_NAME}
    api-key: ${BREVO_API_KEY}
  cloudinary:
    url: cloudinary://${CLOUDINARY_API_KEY}:${CLOUDINARY_API_SECRET}@${CLOUDINARY_CLOUD_NAME}
  finance:
    account-encryption:
      key: ${EDTECH_ACCOUNT_ENCRYPTION_KEY}
