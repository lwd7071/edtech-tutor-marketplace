spring:
  application:
    name: edtech-api

  # --- Database Configuration (Supabase PostgreSQL) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USERNAME:postgres.sxsaggdvlxdiuozfdfrh}
    password: ${DB_PASSWORD:dongdeptrai111}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # --- Redis Configuration (Upstash Redis) ---
  data:
    redis:
      url: ${REDIS_URL:rediss://default:gQAAAAAAAloQAAIgcDFlYzc0NjgwNzNiZGQ0ZjVjYmY1MTBkNzA5ZjQzYmU4Ng@finer-octopus-154128.upstash.io:6379}

  # --- Mail Configuration ---
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # --- Security OAuth2 ---
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: email,profile

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# --- Custom App Configuration ---
app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-secret-change-me-minimum-256-bit}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  oauth2:
    frontend-redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
