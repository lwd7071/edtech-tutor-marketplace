spring:
  application:
    name: edtech-api

  datasource:
    url: jdbc:postgresql://localhost:5432/edtech_db
    username: edtech_user
    password: edtech_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-secret-change-me-minimum-256-bit}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
