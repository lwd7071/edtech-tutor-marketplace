spring:
  application:
    name: edtech-api

  profiles:
    default: cloud

  # Connection details are always injected by the active environment/profile.
  # Do not add cloud credentials or production-safe-looking fallbacks here.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      url: ${REDIS_URL}
      repositories:
        enabled: false

  # --- Mail Configuration ---
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}}

  # --- Security OAuth2 ---
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope: email,profile

  # --- Database Migration ---
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

# --- Custom App Configuration ---
app:
  email:
    provider: ${APP_EMAIL_PROVIDER:smtp}
    from: ${APP_EMAIL_FROM:noreply@tutormatch.local}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
    poll-delay-ms: ${APP_EMAIL_POLL_DELAY_MS:10000}
  jwt:
    secret: ${APP_JWT_SECRET}
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth2:
    frontend-redirect-uri: ${APP_OAUTH2_FRONTEND_CALLBACK_URI:${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}}
  cloudinary:
    url: ${CLOUDINARY_URL:cloudinary://dummy:dummy@dummy}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:disabled}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    connect-timeout: ${PAYOS_CONNECT_TIMEOUT:3s}
    read-timeout: ${PAYOS_READ_TIMEOUT:10s}
  finance:
    account-encryption:
      key: ${EDTECH_ACCOUNT_ENCRYPTION_KEY:01234567890123456789012345678901}

# --- Resilience4j Configuration ---
resilience4j.circuitbreaker:
  instances:
    payosGateway:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      waitDurationInOpenState: 30s
      failureRateThreshold: 50
      recordExceptions:
        - com.edtech.platform.payment.gateway.PaymentGatewayUnavailableException
      ignoreExceptions:
        - com.edtech.platform.payment.gateway.PaymentGatewayRejectedException

# --- Actuator & Observability ---
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-startup}] %logger{36} - %msg%n"
  level:
    org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport: WARN

