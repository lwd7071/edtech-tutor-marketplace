spring:
  config:
    activate:
      on-profile: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope: email,profile
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  task:
    scheduling:
      enabled: false
app:
  email:
    provider: logging
  cache:
    revalidation:
      enabled: false
  scheduling:
    enabled: false
  cloudinary:
    url: ${CLOUDINARY_URL:cloudinary://test:test@test}
  jwt:
    secret: test-jwt-secret-minimum-256-bit-key-for-integration-tests-32chars
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  finance:
    account-encryption:
      key: test-account-encryption-key-32!!

management:
  health:
    mail:
      enabled: false
