spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  task:
    scheduling:
      enabled: false

app:
  jwt:
    secret: test-jwt-secret-minimum-256-bit-key-for-integration-tests-32chars
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
