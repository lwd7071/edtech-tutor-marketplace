services:
  - type: web
    name: edtech-tutor-marketplace
    runtime: docker
    plan: free
    branch: main
    rootDir: backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
