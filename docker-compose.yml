name: edtech

services:
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: [local-mail]
    ports:
      - "127.0.0.1:2525:1025"
      - "127.0.0.1:8025:8025"
    networks: [edtech-network]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EDTECH_POSTGRES_ADMIN_PASSWORD:?Set EDTECH_POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: edtech_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${EDTECH_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edtech_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [edtech-network]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [edtech-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/edtech_db
      DB_USERNAME: edtech_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002,http://localhost:8081,http://127.0.0.1:8081}"
      APP_FRONTEND_URL: http://localhost:8081
      APP_EMAIL_PROVIDER: logging
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@tutormatch.local}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Tutor Match Local}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [edtech-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        BACKEND_API_URL: http://backend:8080
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks: [edtech-network]

  nginx:
    image: nginx:1.30.5-alpine
    ports:
      - "127.0.0.1:${EDTECH_NGINX_PORT:-8081}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [edtech-network]

networks:
  edtech-network:
    name: edtech-network

volumes:
  postgres_data:
    name: edtech-postgres-data
