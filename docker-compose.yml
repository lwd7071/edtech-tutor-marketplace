services:
  mailpit:
    image: axllent/mailpit:v1.20
    profiles: [local-mail]
    ports:
      - "127.0.0.1:2525:1025"
      - "127.0.0.1:8025:8025"

  postgres:
    image: postgres:16-alpine
    container_name: edtech_postgres
    environment:
      POSTGRES_USER: edtech_user
      POSTGRES_PASSWORD: edtech_password
      POSTGRES_DB: edtech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edtech_user -d edtech_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: edtech_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edtech_backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/edtech_db
      DB_USERNAME: edtech_user
      DB_PASSWORD: edtech_password
      REDIS_URL: redis://redis:6379
      APP_JWT_SECRET: "your-256-bit-secret-key-change-this-in-production-environments-min-32-chars"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
